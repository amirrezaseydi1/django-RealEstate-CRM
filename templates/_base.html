<!DOCTYPE html>
<html lang="fa" dir="rtl">
{% load static %}
{% load humanize %}

<head>

    <meta charset="UTF-8">
    <title>{% block title %}RealEstate CRM{% endblock %}</title>
    <!-- Bootstrap RTL CSS -->
    <link href="{% static 'assets/css/bootstrap.rtl.min.css' %}" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

{% block css %}
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/footer.css' %}">
{% endblock %}
{% block extra_css %}

{% endblock %}

<!-- Main CSS -->


<!-- Font (optional) -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
{% include 'navbar.html' %}
<div class="">
    {% include 'message.html' %}
    {% block body %}


    {% endblock %}

</div>
{% include 'footer.html' %}
<script src='{% static 'assets/js/bootstrap.bundle.min.js' %}'></script>
<script src='{% static 'assets/js/java.js' %}'></script>
</body>
</html>
