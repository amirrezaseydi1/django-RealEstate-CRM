{% extends '_base.html' %}

{% block title %}
داشبورد مشاور املاک
{% endblock %}

{% block body %}
<style>
    body {
        background: #f4f8fc;
        color: #111;
    }

    .dashboard-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
    }

    .dashboard-content {
        width: 100%;
        max-width: 1100px;
        text-align: center;
    }

    .dashboard-title {
        font-weight: 800;
        color: #0d6efd;
        margin-bottom: 0.75rem;
    }

    .dashboard-subtitle {
        color: #555;
        margin-bottom: 2.5rem;
        font-size: 1rem;
    }

    .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
    }

    .dashboard-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 150px;
        background: #fff;
        border: 1px solid #dbe9ff;
        border-radius: 20px;
        text-decoration: none;
        color: #111;
        box-shadow: 0 8px 22px rgba(13, 110, 253, 0.06);
        transition: all 0.25s ease;
        padding: 1.25rem;
    }

    .dashboard-card:hover {
        transform: translateY(-6px);
        background: #f7fbff;
        border-color: #9fc4f8;
        box-shadow: 0 14px 28px rgba(13, 110, 253, 0.12);
        color: #0d6efd;
    }

    .dashboard-card.active {
        background: linear-gradient(135deg, #eaf3ff 0%, #dcebff 100%);
        border-color: #8cb8f7;
    }

    .dashboard-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #eaf3ff;
        color: #0d6efd;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin-bottom: 0.9rem;
        transition: all 0.25s ease;
    }

    .dashboard-card:hover .dashboard-icon,
    .dashboard-card.active .dashboard-icon {
        background: #0d6efd;
        color: #fff;
    }

    .dashboard-label {
        font-size: 0.98rem;
        font-weight: 700;
        color: #111;
    }

    .dashboard-card:hover .dashboard-label,
    .dashboard-card.active .dashboard-label {
        color: #0d6efd;
    }

    .welcome-box {
        background: #fff;
        border: 1px solid #e3efff;
        border-radius: 24px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 10px 30px rgba(13, 110, 253, 0.05);
    }
</style>

<div class="dashboard-wrapper">
    <div class="dashboard-content">
        <div class="welcome-box">
            <h2 class="dashboard-title">داشبورد مشاور املاک</h2>
            <p class="dashboard-subtitle">بخش مورد نظر خود را انتخاب کنید</p>

            <div class="dashboard-grid">
                <a href="{% url 'property:create_property_draft' %}"
                   class="dashboard-card {% if request.resolver_match.url_name == 'create_property_draft' %}active{% endif %}">
                    <div class="dashboard-icon">
                        <i class="bi bi-plus-circle"></i>
                    </div>
                    <div class="dashboard-label">ثبت آگهی جدید</div>
                </a>

                <a href="{% url 'property:agent_property' %}"
                   class="dashboard-card {% if request.resolver_match.url_name == 'agent_property' %}active{% endif %}">
                    <div class="dashboard-icon">
                        <i class="bi bi-house-door"></i>
                    </div>
                    <div class="dashboard-label">آگهی‌های من</div>
                </a>

                <a href="{% url 'leads:request-list' %}"
                   class="dashboard-card {% if request.resolver_match.url_name == 'request-list' %}active{% endif %}">
                    <div class="dashboard-icon">
                        <i class="bi bi-card-list"></i>
                    </div>
                    <div class="dashboard-label">لیست درخواست‌ها</div>
                </a>

                <a href="{% url 'leads:create-request' %}" class="dashboard-card">
                    <div class="dashboard-icon">
                        <i class="bi bi-file-earmark-plus"></i>
                    </div>
                    <div class="dashboard-label">ایجاد درخواست</div>
                </a>

                <a href="{% url 'leads:customer_manage' %}" class="dashboard-card">
                    <div class="dashboard-icon">
                        <i class="bi bi-people"></i>
                    </div>
                    <div class="dashboard-label">مدیریت مشتریان</div>
                </a>

                <a href="{% url 'leads:agent_task_list' %}" class="dashboard-card">
                    <div class="dashboard-icon">
                        <i class="bi bi-briefcase"></i>
                    </div>
                    <div class="dashboard-label">لیست کاری</div>
                </a>

                <a href="{% url 'leads:todo_list_form' %}" class="dashboard-card">
                    <div class="dashboard-icon">
                        <i class="bi bi-check2-square"></i>
                    </div>
                    <div class="dashboard-label">ایجاد کار</div>
                </a>
            </div>
        </div>


    </div>
</div>
{% endblock %}
